<!DOCTYPE html>
<html lang="en">
<head>

    p { color: #93a0b5; margin: 0 0 24px; }

      background: #3b6fe0; color: #fff; text-decoration: none; font-weight: 600;

    a.btn:hover { filter: brightness(1.1); }
