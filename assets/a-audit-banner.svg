<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A-Audit — Universal Audit Prompt Builder</title>
  <desc id="desc">A dark blue professional banner featuring an audit icon, product name and evidence-aware audit workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="82" y1="35" x2="1194" y2="618" gradientUnits="userSpaceOnUse"><stop stop-color="#101C36"/><stop offset=".48" stop-color="#11182B"/><stop offset="1" stop-color="#0A101B"/></linearGradient>
    <linearGradient id="mark" x1="76" y1="88" x2="224" y2="224" gradientUnits="userSpaceOnUse"><stop stop-color="#75A4FF"/><stop offset=".52" stop-color="#8B78F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
