  <circle cx="1053" cy="99" r="276" fill="#5B8CFF" fill-opacity=".10"/><circle cx="1107" cy="563" r="302" fill="#22D3EE" fill-opacity=".055"/><circle cx="281" cy="670" r="260" fill="#8B5CF6" fill-opacity=".08"/>
  <g opacity=".25"><path d="M0 507H1280M0 379H1280M0 251H1280M0 123H1280" stroke="#53657F"/><path d="M958 0V640M1086 0V640M1214 0V640" stroke="#53657F"/></g>
  <path d="M77 272H1202" stroke="url(#line)" stroke-opacity=".75"/>
