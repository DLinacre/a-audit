<!-- Recommended ARIA enhancements for interactive toolbars -->
<div class="seg" id="depthSeg" role="group" aria-label="Audit depth selection">
  <button type="button" class="seg-btn" data-depth="focused" aria-pressed="false" tabindex="0">Focused</button>
  <button type="button" class="seg-btn active" data-depth="full" aria-pressed="true" tabindex="0">Full</button>
  <button type="button" class="seg-btn" data-depth="forensic" aria-pressed="false" tabindex="0">Forensic</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">Prompt copied to clipboard</div>
