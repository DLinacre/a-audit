<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121821"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(91, 140, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Accent Orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#blueGlow)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="200" fill="url(#amberGlow)" opacity="0.12" filter="url(#glow)"/>

  <!-- Abstract UI / Hex Grid Motif -->
  <g transform="translate(850, 100)" opacity="0.25">
    <polygon points="100,0 200,50 200,150 100,200 0,150 0,50" fill="none" stroke="#5b8cff" stroke-width="2"/>
    <polygon points="100,30 170,70 170,130 100,170 30,130 30,70" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="25" fill="#f0b429" opacity="0.8"/>
  </g>

  <!-- Pulse Line Divider -->
  <line x1="80" y1="260" x2="1120" y2="260" stroke="url(#blueGlow)" stroke-width="2" opacity="0.4"/>
  <circle cx="600" cy="260" r="4" fill="#5b8cff"/>

  <!-- Typography & Branding -->
  <g transform="translate(80, 130)">
    <rect x="0" y="-35" width="160" height="26" rx="6" fill="rgba(91,140,255,0.12)" stroke="#5b8cff" stroke-width="0.8"/>
    <text x="12" y="-18" fill="#5b8cff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" letter-spacing="1.5">v4.5 · ELITE EDITION</text>
    
    <text x="0" y="30" fill="#e8eef7" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Arena Audit <tspan fill="#5b8cff">A-Audit</tspan></text>
    <text x="0" y="75" fill="#93a0b5" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400">Production-grade, evidence-aware audit prompt generator for AI Agent Mode</text>
  </g>

  <!-- Status Badges / Tech Stack Pills -->
  <g transform="translate(80, 315)">
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#161d28" stroke="#273142"/>
    <text x="65" y="20" fill="#3ecf8e" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 100% Client-Side</text>

    <rect x="145" y="0" width="145" height="32" rx="8" fill="#161d28" stroke="#273142"/>
    <text x="217.5" y="20" fill="#5b8cff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ WCAG 2.2 Ready</text>

    <rect x="305" y="0" width="140" height="32" rx="8" fill="#161d28" stroke="#273142"/>
    <text x="375" y="20" fill="#a78bfa" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 14 Expert Roles</text>

    <rect x="460" y="0" width="130" height="32" rx="8" fill="#161d28" stroke="#273142"/>
    <text x="525" y="20" fill="#f0b429" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⭐ PWA Offline</text>
  </g>
</svg>
