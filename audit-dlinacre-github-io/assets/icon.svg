<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161d28"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>
    <linearGradient id="iconAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Rect -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#iconBg)" stroke="#273142" stroke-width="8"/>

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(91, 140, 255, 0.2)" stroke-width="4"/>

  <!-- Hexagon / Audit Node -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" fill="rgba(91, 140, 255, 0.1)" stroke="url(#iconAccent)" stroke-width="12" filter="url(#iconGlow)"/>

  <!-- Checkmark / Target Icon in Center -->
  <path d="M190 260 L232 302 L322 210" fill="none" stroke="#3ecf8e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="12" fill="#f0b429"/>
</svg>
